name: beauty_connect
description: "BeautyConnect - gestion de citas para manicuristas independientes en Villavicencio"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  cloud_firestore: ^6.4.0
  cupertino_icons: ^1.0.8
  firebase_auth: ^6.5.0
  firebase_core: ^4.8.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^19.4.2
  flutter_map: ^8.2.2
  flutter_riverpod: ^3.3.1
  flutter_staggered_grid_view: ^0.7.0
  http: ^1.6.0
  image_picker: ^1.2.0
  geocoding: ^4.0.0
  google_sign_in: ^7.2.0
  geolocator: ^14.0.2
  intl: ^0.20.3
  latlong2: ^0.9.1
  timezone: ^0.10.1
  url_launcher: ^6.3.2
  gal: ^2.3.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  app_links: ^7.2.1
  share_plus: ^13.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  fonts:
    - family: Gelasio
      fonts:
        - asset: assets/fonts/Gelasio-Regular.ttf
        - asset: assets/fonts/Gelasio-Italic.ttf
          style: italic
        - asset: assets/fonts/Gelasio-Medium.ttf
          weight: 500
        - asset: assets/fonts/Gelasio-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Gelasio-Bold.ttf
          weight: 700
        - asset: assets/fonts/Gelasio-BoldItalic.ttf
          weight: 700
          style: italic
